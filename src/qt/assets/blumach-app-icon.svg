<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>BluMach axonometric terminal</title>
  <desc>A compact historical computer rendered as an architectural blue module.</desc>

  <!-- Casa Blu palette: ceramic blue, light concrete, graphite and oxide red. -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="#173b5e"/>

  <!-- Three large faces form a compact silhouette that survives at 16 px. -->
  <path d="m92 194 171-99 137 79-171 99Z" fill="#e6e2db"
        stroke="#28343d" stroke-width="11" stroke-linejoin="round"/>
  <path d="m92 194 137 79v151L92 345Z" fill="#315b7e"
        stroke="#28343d" stroke-width="11" stroke-linejoin="round"/>
  <path d="m229 273 171-99v151l-171 99Z" fill="#21425d"
        stroke="#28343d" stroke-width="11" stroke-linejoin="round"/>

  <!-- CRT opening on the front and a restrained structural band on the side. -->
  <path d="m121 229 79 46v73l-79-46Z" fill="#102b40"
        stroke="#e6e2db" stroke-width="9" stroke-linejoin="round"/>
  <path d="m260 277 105-61v48l-105 61Z" fill="#e6e2db"/>
  <path d="m340 188 38-22v42l-38 22Z" fill="#b14a3a"
        stroke="#28343d" stroke-width="6" stroke-linejoin="round"/>

  <!-- The small foundation stroke gives the terminal a stable baseline. -->
  <path d="m154 411 75 44 119-69" fill="none" stroke="#557a9f"
        stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
