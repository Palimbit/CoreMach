version: 2

updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Keep the pinned native dependency baseline current.
  - package-ecosystem: "vcpkg"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      native-dependencies:
        patterns:
          - "*"
