name: BluMach bug report
description: Report a problem in a BluMach source build
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Thanks for helping improve BluMach.

        Do not attach ROMs, proprietary software or other restricted files.
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I **have searched** the BluMach issue tracker and found no matching report.
          required: true
        - label: I reproduced the issue with a build from the current BluMach `master` branch.
          required: true
        - label: I will not attach ROMs, proprietary software or other restricted files.
          required: true
  - type: textarea
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    attributes:
      label: Configuration file
      description: Paste the machine configuration after removing personal paths or other private data. It will be formatted automatically.
      render: ini
    validations:
      required: true
  - type: input
    attributes:
      label: Operating system
      description: What is your host operating system?
      placeholder: e.g. Windows 11 24H2
    validations:
      required: true
  - type: input
    attributes:
      label: BluMach commit
      description: Enter the full Git commit used to build BluMach.
      placeholder: e.g. a9a72cb5da9ee2081dd91befe07cd7b3dc74db46
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Build architecture
      description: Which BluMach host build are you using?
      options: 
          - Windows - x64 (64-bit)
          - macOS - Universal (Intel and Apple Silicon)
          - Linux - x64 (64-bit)
          - Linux - ARM (64-bit)
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Build type
      description: What type of BluMach build are you using?
      options:
        - label: New recompiler
        - label: Debug build
  - type: textarea
    attributes:
      label: Additional context
      description: Add logs, build options or other context. Remove private paths and do not attach restricted files.
