name: CMake (macos)

on:

  workflow_dispatch:

  push:
    branches: [ "master" ]
    paths:
      - src/**
      - tests/**
      - cmake/**
      - "**/CMakeLists.txt"
      - "CMakePresets.json"
      - "!.github/workflows/**"
      - .github/workflows/cmake_macos.yml
      - vcpkg.json
      - "!**/Makefile*"

  pull_request:
    paths:
      - src/**
      - tests/**
      - cmake/**
      - "**/CMakeLists.txt"
      - "CMakePresets.json"
      - "!.github/workflows/**"
      - .github/workflows/cmake_macos.yml
      - vcpkg.json
      - "!**/Makefile*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  macos:

    name: "${{ matrix.ui.name }}, ${{ matrix.build.name }}, ${{ matrix.dynarec.name }}, ${{ matrix.environment.arch }}"

    runs-on: ${{ matrix.environment.runner }}
    timeout-minutes: 45

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 400M

    strategy:
      fail-fast: true
      matrix:
        include:
          - build: { name: Debug, preset: dev_debug, slug: -Debug }
            dynarec: { name: ODR, new: off, slug: -ODR }
            ui: { name: SDL GUI, qt: off, slug: -SDL }
            environment: { arch: x86_64, slug: -x86_64, runner: macos-15-intel }
          - build: { name: Dev, preset: development, slug: -Dev }
            dynarec: { name: NDR, new: on, slug: -NDR }
            ui: { name: Qt 6 GUI, qt: on, slug: -Qt6, packages: qt }
            environment: { arch: x86_64, slug: -x86_64, runner: macos-15-intel }
          - build: { name: Debug, preset: dev_debug, slug: -Debug }
            dynarec: { name: NDR, new: on, slug: -NDR }
            ui: { name: Qt 6 GUI, qt: on, slug: -Qt6, packages: qt }
            environment: { arch: arm64, slug: -arm64, runner: macos-14 }
          - build: { name: Dev, preset: development, slug: -Dev }
            dynarec: { name: NDR, new: on, slug: -NDR }
            ui: { name: SDL GUI, qt: off, slug: -SDL }
            environment: { arch: arm64, slug: -arm64, runner: macos-14 }

    steps:
      - name: Install dependencies
        run: >-
          brew install
          ccache
          sdl3
          rtmidi
          openal-soft
          fluidsynth
          libslirp
          vde
          libserialport
          vulkan-headers
          zstd
          ${{ matrix.ui.packages }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.ui.slug }}${{ matrix.dynarec.slug }}${{ matrix.build.slug }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'src/**/CMakeLists.txt', 'vcpkg.json') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.ui.slug }}${{ matrix.dynarec.slug }}${{ matrix.build.slug }}-

      - name: Configure CMake
        run: >-
          cmake -S . -B build --preset ${{ matrix.build.preset }}
          -D NEW_DYNAREC=${{ matrix.dynarec.new }}
          -D QT=${{ matrix.ui.qt }}
          -D CMAKE_PREFIX_PATH=$(brew --prefix qt)
          -D OpenAL_ROOT=$(brew --prefix openal-soft)
          -D LIBSERIALPORT_ROOT=$(brew --prefix libserialport)
          -D CMAKE_C_COMPILER_LAUNCHER=ccache
          -D CMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build

      - name: Run host contract tests
        run: ctest --test-dir build --output-on-failure

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Generate package
        run: cmake --install build

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 'BluMach${{ matrix.ui.slug }}${{ matrix.dynarec.slug }}${{ matrix.build.slug }}-macOS${{ matrix.environment.slug }}-gha${{ github.run_number }}'
          path: build/artifacts/**
          retention-days: 7
