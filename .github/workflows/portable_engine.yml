name: Portable engine

on:
  workflow_dispatch:
  push:
    branches: ["architecture/portable-engine"]
    paths:
      - engine/**
      - runtime/**
      - components/**
      - systems/**
      - platforms/**
      - apps/**
      - tests/engine/**
      - provenance/**
      - doc/validation/**
      - doc/releases/portable-*.md
      - tools/provenance_audit.py
      - tools/portable_package_audit.py
      - tools/validate-pcs86-portable.ps1
      - tools/tests/test_provenance_audit.py
      - CMakeLists.txt
      - tests/CMakeLists.txt
      - .github/workflows/portable_engine.yml
  pull_request:
    branches: ["architecture/portable-engine"]
    paths:
      - engine/**
      - runtime/**
      - components/**
      - systems/**
      - platforms/**
      - apps/**
      - tests/engine/**
      - provenance/**
      - doc/validation/**
      - doc/releases/portable-*.md
      - tools/provenance_audit.py
      - tools/portable_package_audit.py
      - tools/validate-pcs86-portable.ps1
      - tools/tests/test_provenance_audit.py
      - CMakeLists.txt
      - tests/CMakeLists.txt
      - .github/workflows/portable_engine.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: Engine only (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2022, macos-14]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Provenance entries point to immutable historical commits and paths.
          fetch-depth: 0
      - name: Configure engine-only build
        run: >-
          cmake -S . -B build/portable
          -D BLUMACH_BUILD_LEGACY=OFF
          -D BLUMACH_BUILD_ENGINE=ON
          -D BUILD_TESTING=ON
          -D QT=OFF
      - name: Build
        run: cmake --build build/portable --config Debug
      - name: Test
        run: ctest --test-dir build/portable -C Debug --output-on-failure
      - name: Audit provenance
        run: python -B tools/provenance_audit.py
      - name: Test provenance audit
        run: python -B -m unittest tools.tests.test_provenance_audit

  qt-frontend:
    name: Portable Qt6 frontend (ubuntu-26.04)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Qt6 development packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes qt6-base-dev libqt6opengl6-dev
      - name: Configure portable Qt6 build
        run: >-
          cmake -S . -B build/portable-qt
          -D BLUMACH_BUILD_LEGACY=OFF
          -D BLUMACH_BUILD_ENGINE=ON
          -D BLUMACH_BUILD_PORTABLE_QT=ON
          -D BUILD_TESTING=ON
          -D CMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/portable-qt --parallel 4
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/portable-qt --output-on-failure

  windows-package:
    name: Portable package (Windows x86-64)
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Prepare UCRT64 environment
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          release: true
          update: true
          msystem: UCRT64
          pacboy: >-
            ninja:p
            cmake:p
            gcc:p
            qt6-base:p
            qt6-tools:p
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Configure portable product
        run: >-
          cmake -S . -B build/portable-package -G Ninja
          -D BLUMACH_BUILD_LEGACY=OFF
          -D BLUMACH_BUILD_ENGINE=ON
          -D BLUMACH_BUILD_PORTABLE_QT=ON
          -D BUILD_TESTING=ON
          -D CMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/portable-package --parallel 4
      - name: Test
        run: ctest --test-dir build/portable-package --output-on-failure
      - name: Install
        run: cmake --install build/portable-package --prefix "$(cygpath -m "$PWD/build/portable-install")"
      - name: Audit installed package
        run: >-
          python -B tools/portable_package_audit.py
          --root build/portable-install
          --platform windows
          --version 0.0.1-dev.1
          --max-size-mib 100
      - name: Create archive
        run: >-
          cpack --config build/portable-package/CPackConfig.cmake
          -B build/portable-packages -G ZIP
      - name: Upload package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BluMach-Portable-Windows-x86-64
          path: build/portable-packages/*
          retention-days: 7
