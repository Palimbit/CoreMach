name: CMake (Windows)

on:

  workflow_dispatch:

  push:
    branches: [ "master" ]
    paths:
      - src/**
      - tests/**
      - cmake/**
      - "**/CMakeLists.txt"
      - "CMakePresets.json"
      - "!.github/workflows/**"
      - .github/workflows/cmake_windows_msys2.yml
      - vcpkg.json
      - tools/package_audit.py
      - "!**/Makefile*"

  pull_request:
    paths:
      - src/**
      - tests/**
      - cmake/**
      - "**/CMakeLists.txt"
      - "CMakePresets.json"
      - "!.github/workflows/**"
      - .github/workflows/cmake_windows_msys2.yml
      - vcpkg.json
      - tools/package_audit.py
      - "!**/Makefile*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  windows:

    name: "${{ matrix.ui.name }}, ${{ matrix.build.name }}, ${{ matrix.dynarec.name }}, ${{ matrix.environment.msystem }}"

    runs-on: ${{ matrix.environment.runner }}
    timeout-minutes: 40

    env:
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_MAXSIZE: 400M

    defaults:
      run:
        shell: msys2 {0}

    strategy:
      fail-fast: true
      matrix:
        include:
          - build: { name: Debug, preset: dev_debug, slug: -Debug }
            dynarec: { name: ODR, new: off, slug: -ODR }
            ui: &qt6_ui
              name: Qt 6 GUI
              qt: on
              slug: -Qt6
              static: off
              packages: qt6-base:p qt6-tools:p vulkan-headers:p
            environment: &ucrt64
              msystem: UCRT64
              prefix: mingw-w64-ucrt-x86_64
              slug: -64
              runner: windows-2022
          - build: { name: Dev, preset: development, slug: -Dev }
            dynarec: { name: NDR, new: on, slug: -NDR }
            ui: *qt6_ui
            environment: *ucrt64
          - build: { name: Debug, preset: dev_debug, slug: -Debug }
            dynarec: { name: NDR, new: on, slug: -NDR }
            ui: *qt6_ui
            environment: { msystem: CLANGARM64, slug: -arm64, runner: windows-11-arm }

    steps:
      - name: Prepare MSYS2 environment
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          release: true
          update: true
          msystem: ${{ matrix.environment.msystem }}
          pacboy: >-
            ninja:p
            cmake:p
            ccache:p
            gcc:p
            pkgconf:p
            freetype:p
            sdl3:p
            zlib:p
            libpng:p
            openal:p
            rtmidi:p
            libslirp:p
            fluidsynth:p
            libserialport:p
            ${{ matrix.ui.packages }}
            llvm-openmp:p
            zstd:p

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.environment.msystem }}${{ matrix.dynarec.slug }}${{ matrix.build.slug }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'src/**/CMakeLists.txt', 'vcpkg.json') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.environment.msystem }}${{ matrix.dynarec.slug }}${{ matrix.build.slug }}-

      - name: Configure CMake
        run: >-
          cmake -S . -B build --preset ${{ matrix.build.preset }}
          -D NEW_DYNAREC=${{ matrix.dynarec.new }}
          -D QT=${{ matrix.ui.qt }}
          -D STATIC_BUILD=${{ matrix.ui.static }}
          -D CMAKE_C_COMPILER_LAUNCHER=ccache
          -D CMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build

      - name: Run host contract tests
        run: ctest --test-dir build --output-on-failure

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Generate package
        run: cmake --install build

      - name: Validate package
        run: >-
          python tools/package_audit.py
          --root build/artifacts
          --platform windows
          --qt ${{ matrix.ui.qt }}
          --max-size-mib 260

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 'BluMach${{ matrix.dynarec.slug }}${{ matrix.build.slug }}-Windows${{ matrix.environment.slug }}-gha${{ github.run_number }}'
          path: build/artifacts/**
          retention-days: 7
