name: CMake (Linux)

on:

  workflow_dispatch:

  push:
    branches: [ "master" ]
    paths:
      - src/**
      - cmake/**
      - "**/CMakeLists.txt"
      - "CMakePresets.json"
      - "!.github/workflows/**"
      - .github/workflows/cmake_linux.yml
      - vcpkg.json
      - "!**/Makefile*"

  pull_request:
    paths:
      - src/**
      - cmake/**
      - "**/CMakeLists.txt"
      - "CMakePresets.json"
      - "!.github/workflows/**"
      - .github/workflows/cmake_linux.yml
      - vcpkg.json
      - "!**/Makefile*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  linux:

    name: "${{ matrix.ui.name }}, ${{ matrix.build.name }}, ${{ matrix.dynarec.name }}, ${{ matrix.environment.arch }}"

    runs-on: ${{ matrix.environment.runner }}
    timeout-minutes: 35

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 400M

    strategy:
      fail-fast: true
      matrix:
        include:
          - build: { name: Debug, preset: dev_debug, slug: -Debug }
            dynarec: { name: ODR, new: off, slug: -ODR }
            ui: { name: SDL GUI, qt: off, sdl_shader: on, slug: -SDL }
            environment: { arch: x86_64, slug: -x86_64, runner: ubuntu-26.04 }
          - build: { name: Dev, preset: development, slug: -Dev }
            dynarec: { name: NDR, new: on, slug: -NDR }
            ui:
              name: Qt 6 GUI
              qt: on
              sdl_shader: off
              slug: -Qt6
              packages: &qt6_packages >-
                qt6-base-dev
                qt6-base-private-dev
                qt6-tools-dev
                qt6-tools-dev-tools
                qt6-l10n-tools
                qt6-translations-l10n
                libevdev-dev
                libxkbcommon-x11-dev
                libvulkan-dev
            environment: { arch: x86_64, slug: -x86_64, runner: ubuntu-26.04 }
          - build: { name: Debug, preset: dev_debug, slug: -Debug }
            dynarec: { name: NDR, new: on, slug: -NDR }
            ui: { name: Qt 6 GUI, qt: on, sdl_shader: off, slug: -Qt6, packages: *qt6_packages }
            environment: { arch: arm64, slug: -arm64, runner: ubuntu-26.04-arm }
          - build: { name: Dev, preset: development, slug: -Dev }
            dynarec: { name: NDR, new: on, slug: -NDR }
            ui: { name: SDL GUI, qt: off, sdl_shader: on, slug: -SDL }
            environment: { arch: arm64, slug: -arm64, runner: ubuntu-26.04-arm }

    steps:
      - name: Install dependencies
        run: >-
          sudo apt update && sudo apt install
          build-essential
          ccache
          ninja-build
          libfreetype-dev
          libgles2-mesa-dev
          libsdl3-dev
          libpng-dev
          libc6-dev
          librtmidi-dev
          libopenal-dev
          libslirp-dev
          libfluidsynth-dev
          libvdeplug-dev
          libserialport-dev
          libzstd-dev
          ${{ matrix.ui.packages }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.ui.slug }}${{ matrix.dynarec.slug }}${{ matrix.build.slug }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'src/**/CMakeLists.txt', 'vcpkg.json') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.ui.slug }}${{ matrix.dynarec.slug }}${{ matrix.build.slug }}-

      - name: Configure CMake
        run: >-
          cmake -S . -B build --preset ${{ matrix.build.preset }}
          -D NEW_DYNAREC=${{ matrix.dynarec.new }}
          -D QT=${{ matrix.ui.qt }}
          -D USE_SDL_SHADER=${{ matrix.ui.sdl_shader }}
          -D CMAKE_C_COMPILER_LAUNCHER=ccache
          -D CMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cmake --build build

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Generate package
        run: |
          cmake --install build

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 'BluMach${{ matrix.ui.slug }}${{ matrix.dynarec.slug }}${{ matrix.build.slug }}-Ubuntu2604${{ matrix.environment.slug }}-gha${{ github.run_number }}'
          path: build/artifacts/**
          retention-days: 7
