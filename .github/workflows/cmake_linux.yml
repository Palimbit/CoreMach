name: CMake (Linux)

on:

  push:
    branches: [ "master" ]
    paths:
      - src/**
      - cmake/**
      - "**/CMakeLists.txt"
      - "CMakePresets.json"
      - "!.github/workflows/**"
      - .github/workflows/cmake_linux.yml
      - vcpkg.json
      - "!**/Makefile*"

  pull_request:
    paths:
      - src/**
      - cmake/**
      - "**/CMakeLists.txt"
      - "CMakePresets.json"
      - "!.github/workflows/**"
      - .github/workflows/cmake_linux.yml
      - vcpkg.json
      - "!**/Makefile*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  linux:

    name: "${{ matrix.ui.name }}, ${{ matrix.build.name }}, ${{ matrix.dynarec.name }}, ${{ matrix.environment.arch }}"

    runs-on: ${{ matrix.environment.runner }}

    strategy:
      fail-fast: true
      matrix:
        include:
          - build: { name: Debug, preset: dev_debug, slug: -Debug }
            dynarec: { name: ODR, new: off, slug: -ODR }
            ui: { name: SDL GUI, qt: off, sdl_shader: on, slug: -SDL }
            environment: { arch: x86_64, slug: -x86_64, runner: ubuntu-26.04 }
          - build: { name: Dev, preset: development, slug: -Dev }
            dynarec: { name: NDR, new: on, slug: -NDR }
            ui:
              name: Qt 6 GUI
              qt: on
              sdl_shader: off
              slug: -Qt6
              packages: &qt6_packages >-
                qt6-base-dev
                qt6-base-private-dev
                qt6-tools-dev
                qt6-tools-dev-tools
                qt6-l10n-tools
                qt6-translations-l10n
                libevdev-dev
                libxkbcommon-x11-dev
                libvulkan-dev
            environment: { arch: x86_64, slug: -x86_64, runner: ubuntu-26.04 }
          - build: { name: Debug, preset: dev_debug, slug: -Debug }
            dynarec: { name: NDR, new: on, slug: -NDR }
            ui: { name: Qt 6 GUI, qt: on, sdl_shader: off, slug: -Qt6, packages: *qt6_packages }
            environment: { arch: arm64, slug: -arm64, runner: ubuntu-26.04-arm }
          - build: { name: Dev, preset: development, slug: -Dev }
            dynarec: { name: NDR, new: on, slug: -NDR }
            ui: { name: SDL GUI, qt: off, sdl_shader: on, slug: -SDL }
            environment: { arch: arm64, slug: -arm64, runner: ubuntu-26.04-arm }

    steps:
      - name: Install dependencies
        run: >-
          sudo apt update && sudo apt install
          build-essential
          ninja-build
          libfreetype-dev
          libgles2-mesa-dev
          libsdl3-dev
          libpng-dev
          libc6-dev
          librtmidi-dev
          libopenal-dev
          libslirp-dev
          libfluidsynth-dev
          libvdeplug-dev
          libserialport-dev
          libzstd-dev
          ${{ matrix.ui.packages }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Configure CMake
        run: >-
          cmake -S . -B build --preset ${{ matrix.build.preset }}
          -D NEW_DYNAREC=${{ matrix.dynarec.new }}
          -D QT=${{ matrix.ui.qt }}
          -D USE_SDL_SHADER=${{ matrix.ui.sdl_shader }}

      - name: Build
        run: |
          cmake --build build

      - name: Generate package
        run: |
          cmake --install build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'BluMach${{ matrix.ui.slug }}${{ matrix.dynarec.slug }}${{ matrix.build.slug }}-Ubuntu2604${{ matrix.environment.slug }}-gha${{ github.run_number }}'
          path: build/artifacts/**
