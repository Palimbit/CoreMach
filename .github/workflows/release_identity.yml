name: Release identity validation

on:
  workflow_dispatch:

  push:
    branches: [ "master" ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  identity:
    name: Reject obsolete release identifiers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate BluMach release identity
        run: python3 -B tools/check_release_identity.py

      - name: Validate synchronized release metadata
        run: python3 -B tools/release_version.py check

      - name: Test release tooling
        run: |
          python3 -B -m unittest discover -s tools/tests -p "test_release_*.py"
          python3 -B -m unittest discover -s tools/tests -p "test_rc_*.py"
