name: CodeQL Analysis (Linux)

on:

  push:
    branches: [ "master" ]
    paths:
      - src/**
      - cmake/**
      - "**/CMakeLists.txt"
      - "CMakePresets.json"
      - "!.github/workflows/**"
      - .github/workflows/codeql_linux.yml
      - vcpkg.json
      - "!**/Makefile*"

  pull_request:
    branches: [ "master" ]
    paths:
      - src/**
      - cmake/**
      - "**/CMakeLists.txt"
      - "CMakePresets.json"
      - "!.github/workflows/**"
      - .github/workflows/codeql_linux.yml
      - vcpkg.json
      - "!**/Makefile*"

  schedule:
    - cron: '22 11 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  analyze-linux:

    name: "${{ matrix.ui.name }}, ${{ matrix.build.name }}, ${{ matrix.dynarec.name }}, ${{ matrix.environment.arch }}"

    runs-on: ubuntu-26.04

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: true
      matrix:
        include:
          - language: cpp
            build: { name: Debug, preset: dev_debug, slug: -Debug }
            dynarec: { name: ODR, new: off, slug: -ODR }
            ui: { name: SDL GUI, qt: off, sdl_shader: on, slug: -SDL }
            environment: { arch: x86_64, slug: -x86_64, runner: ubuntu-22.04 }
          - language: cpp
            build: { name: Debug, preset: dev_debug, slug: -Debug }
            dynarec: { name: NDR, new: on, slug: -NDR }
            ui:
              name: Qt 6 GUI
              qt: on
              sdl_shader: off
              slug: -Qt6
              packages: >-
                qt6-base-dev
                qt6-base-private-dev
                qt6-tools-dev
                qt6-tools-dev-tools
                qt6-l10n-tools
                qt6-translations-l10n
                libevdev-dev
                libxkbcommon-x11-dev
                libvulkan-dev
            environment: { arch: x86_64, slug: -x86_64, runner: ubuntu-22.04 }

    steps:
      - name: Install dependencies
        run: >-
          sudo apt update && sudo apt install
          build-essential
          ninja-build
          libfreetype-dev
          libgles2-mesa-dev
          libsdl3-dev
          libpng-dev
          libc6-dev
          librtmidi-dev
          libopenal-dev
          libslirp-dev
          libfluidsynth-dev
          libvdeplug-dev
          libserialport-dev
          libzstd-dev
          ${{ matrix.ui.packages }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Configure CMake
        run: >-
          cmake -S . -B build --preset ${{ matrix.build.preset }}
          -D NEW_DYNAREC=${{ matrix.dynarec.new }}
          -D QT=${{ matrix.ui.qt }}
          -D USE_SDL_SHADER=${{ matrix.ui.sdl_shader }}

      - name: Build
        run: cmake --build build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}/ui:${{ matrix.ui.slug }}/dynarec:${{ matrix.dynarec.slug }}/platform:linux"
