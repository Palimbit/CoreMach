name: Catalogue validation

on:
  push:
    branches: [ "master" ]
    paths:
      - src/qt/catalog/**
      - src/qt/CMakeLists.txt
      - src/qt_resources.qrc
      - tools/catalog_audit.py
      - tools/catalog_builder.py
      - tools/tests/test_catalog_*.py
      - .github/workflows/catalog.yml
  pull_request:
    paths:
      - src/qt/catalog/**
      - src/qt/CMakeLists.txt
      - src/qt_resources.qrc
      - tools/catalog_audit.py
      - tools/catalog_builder.py
      - tools/tests/test_catalog_*.py
      - .github/workflows/catalog.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit catalogue and translations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate catalogue
        run: python3 -B tools/catalog_builder.py check

      - name: Test catalogue auditor
        run: python3 -B -m unittest discover -s tools/tests -p "test_catalog_*.py"
